name: Test & Release

on:
    push:
        branches:
            - main

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                php-version: ['8.2', '8.3', '8.4']
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-version }}
                  extensions: json, mbstring
                  coverage: none

            - name: Install dependencies
              run: composer install --no-interaction --prefer-dist

            - name: Run unit tests
              run: composer test:unit

    release:
        needs: test
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Get Version from composer.json
              id: get_version
              run: |
                  VERSION=$(jq -r '.version' composer.json)
                  echo "Version in composer.json: $VERSION"
                  echo "version=$VERSION" >> $GITHUB_OUTPUT

            - name: Get Latest Tag
              id: get_tag
              run: |
                  LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
                  echo "Latest Git tag: $LATEST_TAG"
                  echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT

            - name: Create Release if Version Changed
              if: steps.get_version.outputs.version != '' && steps.get_tag.outputs.tag != format('v{0}', steps.get_version.outputs.version)
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  VERSION=${{ steps.get_version.outputs.version }}
                  echo "New version detected: $VERSION. Creating release..."

                  # Extract changelog for the new version
                  CHANGELOG_ENTRY=$(awk "/## \\[$VERSION\\]/{f=1;next} /## \\[/ && f{f=0} f" CHANGELOG.md 2>/dev/null || echo "")

                  if [ -z "$CHANGELOG_ENTRY" ]; then
                    CHANGELOG_ENTRY="Release v$VERSION"
                  fi

                  gh release create "v$VERSION" --target "${{ github.sha }}" --notes "$CHANGELOG_ENTRY" --title "Version $VERSION"

                  echo "Release v$VERSION created successfully."

            - name: No Version Change
              if: steps.get_version.outputs.version == '' || steps.get_tag.outputs.tag == format('v{0}', steps.get_version.outputs.version)
              run: echo "No new version detected. Skipping release."
